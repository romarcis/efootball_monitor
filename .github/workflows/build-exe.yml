name: Build Windows exe

# Builds eFootballMonitor.exe on Windows.
# - Push a tag like v1.2.0 -> the exe is attached to a GitHub Release.
# - "Run workflow" from the Actions tab -> the exe is available as a build artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pyinstaller openpyxl scapy

      - name: Check the script compiles
        run: python -m py_compile efootball_monitor.py

      - name: Build exe
        run: python -m PyInstaller --onefile --uac-admin --name eFootballMonitor --collect-submodules scapy --clean efootball_monitor.py

      - uses: actions/upload-artifact@v4
        with:
          name: eFootballMonitor
          path: dist/eFootballMonitor.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/eFootballMonitor.exe
          generate_release_notes: true
