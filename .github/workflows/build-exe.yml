name: Build Windows exe

# Builds eFootballMonitor.exe on Windows and publishes it as a new GitHub Release
# every time the script changes on main (or when started by hand from the Actions tab).
on:
  push:
    branches: [main]
    paths: ["efootball_monitor.py", ".github/workflows/build-exe.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pyinstaller openpyxl scapy

      - name: Check the script compiles
        run: python -m py_compile efootball_monitor.py

      - name: Build exe
        run: python -m PyInstaller --onefile --uac-admin --name eFootballMonitor --collect-submodules scapy --clean efootball_monitor.py

      - uses: actions/upload-artifact@v4
        with:
          name: eFootballMonitor
          path: dist/eFootballMonitor.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: eFootball Monitor v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: dist/eFootballMonitor.exe
          generate_release_notes: true
          make_latest: true
